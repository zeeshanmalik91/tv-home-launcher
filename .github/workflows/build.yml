name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Setup Toolchain & Build
        run: |
          sudo apt-get update && sudo apt-get install -y zsh zip
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          mkdir -p .toolchain/jdk-17/Contents
          ln -s $ANDROID_HOME .toolchain/sdk
          ln -s $JAVA_HOME .toolchain/jdk-17/Contents/Home
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: build/tvhome.apk
